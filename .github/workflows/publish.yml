name: Quarto Publish (R & Custom Packages)

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.10'
          activate-environment: r-reticulate
          channels: conda-forge,defaults

      - name: Install Python dependencies via Conda
        run: |
          conda install -n r-reticulate -y pyarrow numpy ipykernel pandas matplotlib polars plotnine statsmodels scipy patsy
        shell: bash -l {0}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R Packages
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install.packages(c('reticulate', 'remotes', 'IRkernel', 'tidyverse', 'NHANES', 'MASS', 'broom', 'Lahman'))
        shell: Rscript {0}

      - name: Prepare README as Index
        run: cp README.md index.md

      - name: Render Quarto
        run: |
          export CONDA_PREFIX=$(conda info --base)/envs/r-reticulate
          export RETICULATE_PYTHON=$CONDA_PREFIX/bin/python
          export LD_LIBRARY_PATH=$CONDA_PREFIX/lib:${LD_LIBRARY_PATH}

          quarto render
          quarto render hw03.qmd --to ipynb --output-dir _site
        shell: bash -l {0}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest

      - name: Create Binder Dockerfile
        run: |
          mkdir -p _site/binder
          cat > _site/binder/Dockerfile <<EOF
          FROM ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}

          ARG NB_USER=jovyan
          ARG NB_UID=1000
          ENV USER=\${NB_USER}
          ENV NB_UID=\${NB_UID}
          ENV HOME=/home/\${NB_USER}

          USER root
          COPY . \${HOME}
          RUN chown -R \${NB_UID}:users \${HOME}

          USER \${NB_USER}
          WORKDIR \${HOME}

          ENTRYPOINT []
          EOF
        shell: bash -l {0}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
